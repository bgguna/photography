{{define "admin_dashboard_content"}}
<h2>Dashboard</h2>
<div class="stats">
    <div class="card stat">
        <div class="num">{{.PhotoCount}}</div>
        <div class="label">Photos</div>
        <a href="/admin/photos" class="btn btn-primary">Manage photos</a>
    </div>
    <div class="card stat">
        <div class="num {{if gt .UnreadMessages 0}}text-danger{{else}}text-success{{end}}">{{.UnreadMessages}}</div>
        <div class="label">Unread messages</div>
        <a href="/admin/messages" class="btn btn-primary">View messages</a>
    </div>
</div>
{{end}}
