{{define "admin_photos"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos — Admin — Photography</title>
    <style>
        :root {
            --primary-bg: #ffffff;
            --primary-text: #1a1a1a;
            --border-color: #e0e0e0;
            --hover-bg: #f5f5f5;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary-bg: #1a1a1a;
                --primary-text: #ffffff;
                --border-color: #333333;
                --hover-bg: #2a2a2a;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--primary-text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        header {
            padding: 1.5rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        nav {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        nav a, nav form {
            text-decoration: none;
            color: var(--primary-text);
        }

        nav a.active {
            font-weight: 600;
            border-bottom: 2px solid #1976d2;
        }

        nav form {
            margin: 0;
            margin-left: auto;
        }

        nav button {
            padding: 0.5rem 1rem;
            background-color: #757575;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            background-color: var(--hover-bg);
            border-radius: 4px;
        }

        .photo-item.hidden {
            opacity: 0.5;
            border: 2px dashed var(--border-color);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upload-section {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            margin: 2rem 0;
            background-color: var(--hover-bg);
        }

        input[type="file"] {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 100%;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Photography Admin</h1>
        <nav>
            <a href="/admin">Dashboard</a>
            <a href="/admin/photos" class="active">Photos</a>
            <a href="/admin/messages">Messages</a>
            <a href="/">← Back</a>
            <form method="POST" action="/admin/logout">
                <button type="submit">Logout</button>
            </form>
        </nav>
    </header>

    <main>
        <h2>Manage Photos</h2>

        <div class="upload-section">
            <h3>Upload Photo</h3>
            <form id="photoUploadForm" hx-post="/admin/photos" hx-encoding="multipart/form-data">
                <input type="file" name="file" accept="image/jpeg,image/png" required>
                <button type="submit" class="btn">Upload</button>
            </form>
        </div>

        {{if .Photos}}
        <div class="photo-grid">
            {{range .Photos}}
            <div id="photo-{{.ID}}" class="photo-item {{if eq .IsPublic 0}}hidden{{end}}">
                <img src="/admin/photos/{{.ID}}/thumb" alt="Photo {{.ID}}">
            </div>
            {{end}}
        </div>
        {{else}}
        <p>No photos yet.</p>
        {{end}}
    </main>

    <script src="/static/vendor/htmx.min.js"></script>
</body>
</html>
{{end}}
