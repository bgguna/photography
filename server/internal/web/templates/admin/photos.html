{{define "admin_photos_content"}}
<h2>Photos</h2>

<section class="card">
    <h3>Upload</h3>
    <form class="upload-row"
          hx-post="/admin/photos"
          hx-encoding="multipart/form-data"
          hx-target="#photoGrid"
          hx-swap="innerHTML"
          hx-indicator="#uploadIndicator"
          hx-on::after-request="if (event.detail.successful) this.reset()">
        <input type="file" name="file" accept="image/jpeg,image/png" required>
        <button type="submit" class="btn btn-primary">Upload</button>
        <span id="uploadIndicator" class="htmx-indicator"><span class="spinner"></span> Uploading…</span>
    </form>
</section>

<div id="photoGrid" class="photo-grid">{{template "admin_photo_grid" .Photos}}</div>
{{end}}

{{define "admin_photo_grid"}}{{range .}}{{template "admin_photo_item" .}}{{else}}<p class="empty">No photos yet. Upload your first one above.</p>{{end}}{{end}}

{{define "admin_photo_item"}}
<figure id="photo-{{.ID}}" class="photo-item{{if eq .IsPublic 0}} is-hidden{{end}}">
    <div class="thumb">
        <img src="/admin/photos/{{.ID}}/thumb" alt="Photo {{.ID}}" loading="lazy">
        {{if eq .IsPublic 0}}<span class="badge">Hidden</span>{{end}}
    </div>
    <figcaption class="photo-actions">
        <button class="btn btn-sm" title="Move earlier" aria-label="Move earlier"
                hx-post="/admin/photos/{{.ID}}/move" hx-vals='{"direction": "up"}'
                hx-target="#photoGrid" hx-swap="innerHTML">↑</button>
        <button class="btn btn-sm" title="Move later" aria-label="Move later"
                hx-post="/admin/photos/{{.ID}}/move" hx-vals='{"direction": "down"}'
                hx-target="#photoGrid" hx-swap="innerHTML">↓</button>
        <button class="btn btn-sm {{if eq .IsPublic 0}}btn-success{{end}}"
                hx-post="/admin/photos/{{.ID}}/visibility"
                hx-target="#photo-{{.ID}}" hx-swap="outerHTML">{{if eq .IsPublic 0}}Publish{{else}}Hide{{end}}</button>
        <button class="btn btn-sm btn-danger"
                hx-delete="/admin/photos/{{.ID}}"
                hx-confirm="Delete this photo permanently?"
                hx-target="#photoGrid" hx-swap="innerHTML">Delete</button>
    </figcaption>
</figure>
{{end}}
