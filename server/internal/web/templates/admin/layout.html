{{define "admin_layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "admin_title" .}}Admin — Photography{{end}}</title>
    <style>
        :root {
            --primary-bg: #ffffff;
            --primary-text: #1a1a1a;
            --border-color: #e0e0e0;
            --hover-bg: #f5f5f5;
            --danger-color: #d32f2f;
            --success-color: #388e3c;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary-bg: #1a1a1a;
                --primary-text: #ffffff;
                --border-color: #333333;
                --hover-bg: #2a2a2a;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--primary-text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }

        header {
            padding: 1.5rem 1rem;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--primary-bg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        nav {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--primary-text);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 0.7;
        }

        nav a.active {
            font-weight: 600;
            border-bottom: 2px solid #1976d2;
            padding-bottom: 0.5rem;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
        }

        .toolbar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #1976d2;
            color: white;
        }

        .btn-primary:hover {
            background-color: #1565c0;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background-color: #c62828;
        }

        .btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background-color: #2e7d32;
        }

        .btn-secondary {
            background-color: #757575;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #616161;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .photo-item {
            position: relative;
            overflow: hidden;
            background-color: var(--hover-bg);
            border-radius: 4px;
            aspect-ratio: 1;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-item.hidden {
            opacity: 0.5;
            border: 2px dashed var(--border-color);
        }

        .photo-item.hidden::after {
            content: "HIDDEN";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--danger-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .photo-actions {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 0.75rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .photo-item:hover .photo-actions {
            opacity: 1;
        }

        .photo-actions button {
            flex: 1;
            padding: 0.5rem;
            border: none;
            border-radius: 3px;
            font-size: 0.75rem;
            cursor: pointer;
            color: white;
            transition: background-color 0.2s;
        }

        .photo-actions .btn-danger {
            background-color: var(--danger-color);
        }

        .photo-actions .btn-success {
            background-color: var(--success-color);
        }

        .photo-actions .btn-secondary {
            background-color: #757575;
        }

        .message-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message-item {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1rem;
            background-color: var(--hover-bg);
        }

        .message-item.unread {
            background-color: rgba(25, 118, 210, 0.1);
            border-left: 4px solid #1976d2;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .message-from {
            font-weight: 600;
        }

        .message-date {
            font-size: 0.9rem;
            color: #666;
        }

        .message-content {
            margin: 1rem 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .loading {
            opacity: 0.6;
        }

        .htmx-request .loading {
            opacity: 1;
        }

        .error-msg {
            color: var(--danger-color);
            padding: 1rem;
            background-color: rgba(211, 47, 47, 0.1);
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .success-msg {
            color: var(--success-color);
            padding: 1rem;
            background-color: rgba(56, 142, 60, 0.1);
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .upload-progress {
            display: none;
        }

        .htmx-request.upload-progress {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .spinner {
            border: 3px solid rgba(25, 118, 210, 0.3);
            border-top: 3px solid #1976d2;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body {{if .Theme}}data-theme="{{ .Theme }}"{{end}}>
    <header>
        <h1>Photography Admin</h1>
        <nav>
            <a href="/admin" {{if eq .Page "dashboard"}}class="active"{{end}}>Dashboard</a>
            <a href="/admin/photos" {{if eq .Page "photos"}}class="active"{{end}}>Photos</a>
            <a href="/admin/messages" {{if eq .Page "messages"}}class="active"{{end}}>Messages</a>
            <a href="/" style="margin-left: auto;">← Back to Gallery</a>
            <form method="POST" action="/admin/logout" style="margin: 0;">
                <button type="submit" class="btn btn-secondary" style="margin: 0;">Logout</button>
            </form>
        </nav>
    </header>

    <main>
        {{block "admin_content" .}}{{end}}
    </main>

    <footer>
        <p>&copy; 2024. All rights reserved.</p>
    </footer>

    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/alpine.min.js"></script>
</body>
</html>
{{end}}
