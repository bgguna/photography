{{define "site_header"}}
<header>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <h1>Bogdan Guna Photography</h1>
    <nav>
        <a href="/"{{if eq .Page "home"}} class="active" aria-current="page"{{end}}>Home</a>
        <a href="/about"{{if eq .Page "about"}} class="active" aria-current="page"{{end}}>About</a>
        <a href="/contact"{{if eq .Page "contact"}} class="active" aria-current="page"{{end}}>Contact</a>
    </nav>
</header>
{{end}}
